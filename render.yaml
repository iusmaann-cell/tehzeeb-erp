databases:
  - name: tehzeeb-erp-db
    plan: free
    postgresMajorVersion: "16"

services:
  # ---- Backend API ----
  - type: web
    name: tehzeeb-erp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tehzeeb-erp-db
          property: connectionString

  # ---- Frontend (static site) ----
  - type: web
    name: tehzeeb-erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Render assigns URLs as https://<service-name>.onrender.com — matches the
      # backend service name above. Double-check this against the actual URL
      # shown in your Render dashboard after the first deploy.
      - key: VITE_API_URL
        value: https://tehzeeb-erp-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
